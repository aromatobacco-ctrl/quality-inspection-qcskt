<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Quality Inspection Dashboard SKT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-api.js"></script>
  <style>
    body { background: linear-gradient(135deg, #eee6f4 0%, #dbcbe7 48%, #e8deef 100%) fixed; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans p-4">
  <div class="w-full max-w-sm bg-purple-950 text-slate-100 rounded-2xl shadow-2xl p-8 border border-purple-800/60">
    <h1 class="text-lg font-bold text-purple-200 mb-1 text-center">Quality Inspection Dashboard</h1>
    <p class="text-xs text-slate-400 mb-6 text-center">Sigaret Kretek Tangan</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-300 mb-1">Username</label>
        <input id="username" type="text" required autocomplete="username"
          class="w-full bg-slate-900 border border-purple-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">Password</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="w-full bg-slate-900 border border-purple-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>
      <p id="errorMsg" class="text-xs text-rose-400 hidden"></p>
      <button type="submit" id="submitBtn"
        class="w-full bg-gradient-to-r from-purple-600 to-purple-500 text-white font-bold rounded-xl py-2 text-sm">
        Masuk
      </button>
    </form>

    <button id="showSetupBtn" type="button" class="mt-5 w-full text-xs text-purple-300 hover:text-white underline">
      Setup Admin Pertama
    </button>

    <form id="setupForm" class="hidden mt-5 pt-5 border-t border-purple-800 space-y-3">
      <p class="text-xs text-purple-200 font-semibold">Hanya digunakan sekali saat instalasi awal.</p>
      <input id="setupName" type="text" required placeholder="Nama Admin"
        class="w-full bg-slate-900 border border-purple-700 rounded-lg px-3 py-2 text-sm">
      <input id="setupUsername" type="text" required placeholder="Username Admin"
        class="w-full bg-slate-900 border border-purple-700 rounded-lg px-3 py-2 text-sm">
      <input id="setupPassword" type="password" required minlength="8" placeholder="Password minimal 8 karakter"
        class="w-full bg-slate-900 border border-purple-700 rounded-lg px-3 py-2 text-sm">
      <button type="submit" id="setupBtn"
        class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold rounded-xl py-2 text-sm">
        Buat Admin Pertama
      </button>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const setupForm = document.getElementById('setupForm');
    const errorMsg = document.getElementById('errorMsg');

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.remove('hidden');
    }

    document.getElementById('showSetupBtn').addEventListener('click', () => {
      setupForm.classList.toggle('hidden');
    });

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const status = await qcApiRequest('/api/auth/status');
        if (status.user) window.location.replace('dashboard.html');
      } catch (error) {
        showError(error.message);
      }
    });

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMsg.classList.add('hidden');
      const button = document.getElementById('submitBtn');
      button.disabled = true;
      button.textContent = 'Memproses...';
      try {
        await qcApiRequest('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        window.location.replace('dashboard.html');
      } catch (error) {
        showError(error.message);
      } finally {
        button.disabled = false;
        button.textContent = 'Masuk';
      }
    });

    setupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMsg.classList.add('hidden');
      const button = document.getElementById('setupBtn');
      button.disabled = true;
      button.textContent = 'Membuat Admin...';
      try {
        await qcApiRequest('/api/auth/bootstrap', {
          method: 'POST',
          body: JSON.stringify({
            displayName: document.getElementById('setupName').value.trim(),
            username: document.getElementById('setupUsername').value.trim(),
            password: document.getElementById('setupPassword').value
          })
        });
        window.location.replace('dashboard.html');
      } catch (error) {
        showError(error.message);
      } finally {
        button.disabled = false;
        button.textContent = 'Buat Admin Pertama';
      }
    });
  </script>
</body>
</html>
